name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: schema is a valid JSON Schema
        run: |
          python -c "
          import json, jsonschema
          schema = json.load(open('schema/lis-0.1.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          print('schema ok')"
      - name: examples validate (schema + semantics)
        run: python tools/lis-validate examples/*.lis.*
      - name: archinstall translator smoke test
        run: |
          python tools/lis2archinstall.py examples/server-btrfs.lis.json --out /tmp/arch
          python -m json.tool /tmp/arch/user_configuration.json > /dev/null
          python -m json.tool /tmp/arch/user_credentials.json > /dev/null
          echo "translator output parses"
      - name: autoinstall translator smoke test
        run: |
          python tools/lis2autoinstall.py examples/server-lvm-pool.lis.json --out /tmp/ubu
          python -c "import yaml; d = yaml.safe_load(open('/tmp/ubu/user-data')); assert d['autoinstall']['version'] == 1; assert any(c['type'] == 'lvm_volgroup' for c in d['autoinstall']['storage']['config'])"
          echo "autoinstall output parses"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: reference crate tests
        run: cargo test --manifest-path bindings/rust/Cargo.toml
      - name: default nixos translator smoke test
        run: |
          cargo run --manifest-path bindings/rust/Cargo.toml --bin lis2nixos -- \
            examples/server-lvm-pool.lis.json --out /tmp/nixos
          test -s /tmp/nixos/disko.nix && test -s /tmp/nixos/hardware.nix && test -s /tmp/nixos/configuration.nix
          grep -q lvm_pv /tmp/nixos/disko.nix
          echo "lis2nixos output ok"
