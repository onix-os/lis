# LIS authoring in YAML — converts 1:1 to canonical JSON.
lis: "0.1.0"
meta:
  name: laptop
  description: Encrypted GNOME laptop with zram swap.

target:
  arch: x86_64
  firmware: uefi
  disks:
    - id: main
      match: { type: nvme, smallest: true }

storage:
  wipe: true
  partitions:
    - { disk: main, role: esp, size: 1GiB }
    - { disk: main, id: p-luks, role: raw, size: rest, fs: none }
  encryption:
    - id: crypt-root
      over: p-luks
      type: luks2
      key: { passphrase: true }
      unlock: [tpm2, passphrase]
  lvm:
    - name: pool
      devices: [crypt-root]
      volumes:
        - { name: root, size: rest, fs: btrfs, mountpoint: /,
            subvolumes: [ { name: "@", mountpoint: / },
                          { name: "@home", mountpoint: /home } ] }
  swap:
    zram: { size: 50% }
  snapshots: { enabled: true, tool: auto, boot_menu: true }

boot:
  loader: systemd-boot
  os_prober: true
  secure_boot: auto
  kernel: { variant: default, params: [quiet, splash] }
  initramfs: { generator: auto, include_modules: [nvme] }

system:
  hostname: drift
  timezone: Europe/Amsterdam
  hwclock: localtime            # Windows lives on the other disk
  time: { ntp: true, provider: auto }
  locale: en_US.UTF-8
  keymap: { console: us, layout: us }
  telemetry: "off"


users:
  - name: bresilla
    admin: true
    shell: zsh
    password: { hash: "$y$j9T$examplesalt$examplehash" }

network:
  manager: networkmanager
  wifi:
    - { ssid: home, psk_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }

software:
  role: desktop:gnome
  packages: [firefox, git]
  flatpak: [org.signal.Signal]

desktop:
  display_manager: gdm
  autologin: bresilla
  audio: pipewire
  bluetooth: true
  printing: true

drivers:
  gpu: intel
  microcode: auto
  firmware: auto

installer:
  on_finish: reboot
  interactive: [storage]
